name: StickerTV
options:
  bundleIdPrefix: com.sametalkis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  StickerTV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Sources/StickerCore
      - path: Sources/SevenTVSource
      - path: Sources/WhatsAppEngine
      - path: Sources/StickerAppCore
    settings:
      base:
        PRODUCT_NAME: StickerTV
        PRODUCT_BUNDLE_IDENTIFIER: com.sametalkis.StickerTV
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES

schemes:
  StickerTV:
    build:
      targets:
        StickerTV: all
    archive:
      config: Release
