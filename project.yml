name: StickerTV
options:
  bundleIdPrefix: com.sametalkis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    from: "0.14.6"
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    from: "5.19.0"

targets:
  StickerTV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Sources/StickerCore
      - path: Sources/SevenTVSource
      - path: Sources/WhatsAppEngine
      - path: Sources/StickerAppCore
    dependencies:
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - package: SDWebImage
        product: SDWebImage
    settings:
      base:
        PRODUCT_NAME: StickerTV
        PRODUCT_BUNDLE_IDENTIFIER: com.sametalkis.StickerTV
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES

schemes:
  StickerTV:
    build:
      targets:
        StickerTV: all
    archive:
      config: Release
