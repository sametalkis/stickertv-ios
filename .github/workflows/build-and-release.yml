name: Build & Release IPA

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project StickerTV.xcodeproj

      - name: Build & Archive App
        run: |
          xcodebuild archive \
            -project StickerTV.xcodeproj \
            -scheme StickerTV \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StickerTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/StickerTV.xcarchive/Products/Applications/StickerTV.app build/Payload/
          cd build
          zip -r -9 StickerTV.ipa Payload
          ls -lh StickerTV.ipa

      - name: Determine Tag & Release Name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerTV-IPA
          path: build/StickerTV.ipa

      - name: Update AltStore & SideStore Source (apps.json)
        run: |
          python3 -c "
          import json, os, datetime

          tag = '${{ steps.vars.outputs.tag }}'
          clean_version = tag.lstrip('v')
          ipa_path = 'build/StickerTV.ipa'
          size = os.path.getsize(ipa_path) if os.path.exists(ipa_path) else 597635
          today = datetime.date.today().isoformat()
          dl_url = f'https://github.com/${{ github.repository }}/releases/download/{tag}/StickerTV.ipa'

          with open('apps.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          if data.get('apps'):
              app = data['apps'][0]
              app['version'] = clean_version
              app['versionDate'] = today
              app['downloadURL'] = dl_url
              app['size'] = size

              new_ver = {
                  'version': clean_version,
                  'buildVersion': clean_version.split('.')[-1],
                  'date': today,
                  'size': size,
                  'downloadURL': dl_url,
                  'localizedDescription': f'Release {tag}',
                  'minOSVersion': '17.0'
              }
              versions = app.get('versions', [])
              if not any(v.get('version') == clean_version for v in versions):
                  versions.insert(0, new_ver)
              app['versions'] = versions

          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore(source): update apps.json for ${{ steps.vars.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git push origin master || echo "Push failed or already up to date"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: StickerTV ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            build/StickerTV.ipa
            apps.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
